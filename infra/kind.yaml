kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: habitapp-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 28080, listenAddress: "127.0.0.1", protocol: TCP}
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
